<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriVault</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #0b1711;
            --surface: #12251a;
            --card: #193426;
            --green: #c5f36a;
            --text: #f2f7f0;
            --muted: #b1c2b5;
            --border: #304b39;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(ellipse at top right,
                    rgba(197, 243, 106, 0.12), transparent 45%),
                linear-gradient(135deg, #0b1711, #10291c, #183523);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: rgba(11, 33, 24, 0.96);
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .navbar-brand {
            color: var(--text) !important;
            font-size: 25px;
            font-weight: 700;
            text-decoration: none;
        }

        .navbar-brand span {
            color: var(--green);
        }

        .home-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .home-link:hover {
            color: var(--green);
        }

        /* Registration layout */
        .register-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }

        .register-card {
            background: rgba(18, 37, 26, 0.96);
            width: 100%;
            max-width: 490px;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.28);
        }

        .logo-icon {
            width: 66px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border-radius: 19px;
            background: rgba(197, 243, 106, 0.10);
            border: 1px solid rgba(197, 243, 106, 0.20);
            font-size: 33px;
        }

        .logo {
            text-align: center;
            font-size: 29px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--green);
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Form */
        .form-label {
            font-weight: 500;
            color: #dce8dd;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-control {
            background: #0d1d13;
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #36513e;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-control::placeholder {
            color: #718576;
        }

        .form-control:focus {
            background: #0d1d13;
            color: var(--text);
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(197, 243, 106, 0.10);
        }

        .register-btn {
            width: 100%;
            border: none;
            background: var(--green);
            color: #122016;
            padding: 13px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 15px;
            margin-top: 8px;
            transition: 0.25s;
        }

        .register-btn:hover {
            background: #b2e65b;
            color: #122016;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(197, 243, 106, 0.12);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
        }

        .login-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .secure-note {
            text-align: center;
            color: #829588;
            font-size: 11px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 18px;
            color: #829588;
            font-size: 12px;
            border-top: 1px solid rgba(48, 75, 57, 0.6);
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 30px 22px;
                border-radius: 18px;
            }

            .logo {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">
                Agri<span>Vault</span> 🌾
            </a>

            <a href="/" class="home-link">← Back to Home</a>
        </div>
    </nav>

    <!-- Registration Section -->
    <main class="register-section">
        <div class="register-card">

            <div class="logo-icon">🌱</div>

            <h1 class="logo">
                Join <span>AgriVault</span>
            </h1>

            <p class="subtitle">
                Create your account to explore agricultural knowledge,
                farming resources and government policies.
            </p>

            <form method="POST" action="/register">

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    Create Account →
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="/login">Login here</a>
            </div>

            <div class="secure-note">
                🌿 Agricultural Knowledge and Policy Repository
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        © 2026 AgriVault. Agricultural Knowledge and Policy Repository.
    </footer>

</body>
</html>
