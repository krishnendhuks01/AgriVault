<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriVault</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #eef7ed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718075;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label {
            font-weight: 500;
            color: #37483b;
        }

        .form-control {
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid #dce6dc;
        }

        .form-control:focus {
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
        }

        .register-btn {
            width: 100%;
            border: none;
            background: #2e7d32;
            color: white;
            padding: 12px;
            border-radius: 25px;
            font-weight: 600;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #256628;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #718075;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">
            AgriVault 🌾
        </div>

        <div class="subtitle">
            Create your account
        </div>

        <form method="POST" action="/register">

            <div class="mb-3">
                <label class="form-label">Full Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
