
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - AgriVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background: #f4f8f3;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #2e7d32;
        }
        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }
        .green { color: #2e7d32; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin_dashboard">
            🌾 AgriVault Admin
        </a>
        <a class="btn btn-light btn-sm" href="/logout">Logout</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="green fw-bold">Welcome, Admin!</h2>
    <p>Manage agricultural knowledge and government policy updates.</p>

    <div class="row g-4 mt-2">
        <div class="col-md-6">
            <div class="stat-card">
                <h5>Total Articles</h5>
                <h2 class="green">{{ total_articles }}</h2>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card">
                <h5>Total Categories</h5>
                <h2 class="green">{{ total_categories }}</h2>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-3">
        <div class="col-md-4">
            <a href="/admin/articles" class="btn btn-success w-100 p-3">
                Manage Articles
            </a>
        </div>
        <div class="col-md-4">
            <a href="/admin/policies" class="btn btn-outline-success w-100 p-3">
                Manage Policies
            </a>
        </div>
        <div class="col-md-4">
            <a href="/admin/categories" class="btn btn-outline-success w-100 p-3">
                Manage Categories
            </a>
        </div>
    </div>
</div>
</body>
</html>
