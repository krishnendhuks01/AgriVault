<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Query - AgriVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f8f3;
        }

        .navbar {
            background: #2e7d32;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .query-box {
            max-width: 750px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            color: #2e7d32;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        textarea {
            resize: none;
        }

        .btn-query {
            background: #2e7d32;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            margin-top: 15px;
        }

        .btn-query:hover {
            background: #256628;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">

        <a class="navbar-brand" href="/user_dashboard">
            🌾 AgriVault
        </a>

        <a href="/user_dashboard" class="back">
            ← Dashboard
        </a>

    </div>
</nav>


<div class="container">

    <div class="query-box">

        <h2 class="title">🤖 Smart Agricultural Query</h2>

        <p class="subtitle">
            Ask your agricultural question in natural language
        </p>

        <form method="POST" action="/query">

            <div class="mb-3">

                <label class="form-label">
                    Your Question
                </label>

                <textarea
                    name="question"
                    class="form-control"
                    rows="5"
                    placeholder="Example: How can I control pests in tomato plants?"
                    required></textarea>

            </div>

            <button type="submit" class="btn-query">
                🔍 Find Answer
            </button>

        </form>

    </div>

</div>

</body>
</html>
