
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Government Policy - AgriVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f8f3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #2e7d32;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .form-card {
            max-width: 800px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
            🌾 AgriVault
        </a>
        <a href="{{ url_for('logout') }}" class="btn btn-light btn-sm">
            Logout
        </a>
    </div>
</nav>

<div class="container">
    <div class="form-card">

        <h2 class="text-center mb-2">🌱 Add Government Policy</h2>
        <p class="text-center text-muted mb-4">
            Enter agricultural scheme and policy details
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        
<form method="POST"
      action="{{ url_for('edit_policy', policy_id=policy.policy_id) if policy else url_for('add_policy') }}">


            <div class="mb-3">
                <label class="form-label">Policy / Scheme Name *</label>
                
<input type="text" name="title" class="form-control"
       value="{{ policy.title if policy else '' }}"
       maxlength="255" required>

            </div>

            <div class="mb-3">
                <label class="form-label">Description *</label>
                
<textarea name="description" class="form-control"
          rows="4" required>{{ policy.description if policy else '' }}</textarea>

            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                
<input type="text" name="department" class="form-control"
       value="{{ policy.department if policy else '' }}"
       placeholder="e.g. Ministry of Agriculture">

            </div>

            <div class="mb-3">
                <label class="form-label">Eligibility</label>
                
<textarea name="eligibility" class="form-control"
          rows="3" placeholder="Who can apply?">{{ policy.eligibility if policy else '' }}</textarea>

            </div>

            <div class="mb-3">
                <label class="form-label">Benefits</label>
                
<textarea name="benefits" class="form-control"
          rows="3" placeholder="What benefits are provided?">{{ policy.benefits if policy else '' }}</textarea>

            </div>

            <div class="mb-4">
                <label class="form-label">Official Website URL</label>
                
<input type="url" name="official_url" class="form-control"
       value="{{ policy.official_url if policy else '' }}"
       placeholder="https://example.gov.in">

            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success">
                    Save Policy
                </button>

                <a href="{{ url_for('manage_policies') }}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
